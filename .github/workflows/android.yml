name: 안드로이드 APK 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: 올린 zip 풀기 (zip 하나만 올렸을 때)
        run: |
          if [ -f jachwi3d-app.zip ]; then
            unzip -q -o jachwi3d-app.zip -d _zip
            cp -r _zip/jachwi3d-app/. .
            rm -rf _zip
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: 패키지 설치
        run: npm install

      - name: 웹 파일 준비 (라이브러리 내장)
        run: npm run build:web

      - name: 안드로이드 프로젝트 만들기
        run: npx cap add android

      - name: 아이콘·시작 화면 만들기
        run: npx capacitor-assets generate --android

      - name: 권한·버전 설정
        run: npm run android:patch

      - name: 동기화
        run: npx cap sync android

      - name: APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "../jachwi3d-1.0.${BUILD_NUMBER}.apk"

      - name: 빌드 결과 보관
        uses: actions/upload-artifact@v4
        with:
          name: jachwi3d-apk
          path: jachwi3d-*.apk

      - name: 릴리스에 올리기 (폰에서 바로 받기)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 자취방 3D 1.0.${{ github.run_number }}
          body: 폰에서 아래 jachwi3d-1.0.${{ github.run_number }}.apk 를 눌러 받은 뒤 설치하세요.
          files: jachwi3d-*.apk
          make_latest: true
